name: Bina APK NEXPLAY

on:
  push:
  workflow_dispatch:

jobs:
  bina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sediakan JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Runner GitHub SUDAH ada Android SDK di /usr/local/lib/android/sdk.
      # setup-android v3 gagal kerana cuba pasang pakej 'tools' yang tiada.
      # Jadi kita guna SDK sedia ada sahaja.
      - name: Sahkan Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" | head -20
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "tiada platforms"

      - name: Sediakan Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Terima lesen SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Pasang platform yang diperlukan
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true

      - name: Bina APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Senaraikan APK
        run: find . -name "*.apk" -exec ls -la {} \;

      - name: Muat naik APK
        uses: actions/upload-artifact@v4
        with:
          name: nexplay-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
