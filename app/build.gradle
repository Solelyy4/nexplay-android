plugins { id 'com.android.application' }

android {
    namespace 'com.boz.nexplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.boz.nexplay"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Aset tidak dimampatkan supaya WebView boleh membacanya terus
    androidResources {
        noCompress 'html', 'js', 'json', 'css'
    }
}

// TIADA dependencies — MainActivity hanya guna android.app.Activity dan
// android.webkit.WebView (kedua-duanya dalam SDK asas).
// appcompat menarik kotlin-stdlib dua versi -> "Duplicate class" -> binaan gagal.
dependencies { }
