plugins { id 'com.android.application' }

android {
    namespace 'com.boz.nexplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.boz.nexplay"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // aset tidak dimampatkan supaya boleh dibaca WebView
    aaptOptions { noCompress 'html', 'js', 'json', 'css' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
