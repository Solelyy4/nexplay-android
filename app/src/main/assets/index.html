<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEXPLAY</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0a0a0f; --bg2:#101018; --card:#16161f; --text:#f5f5f7; --muted:#8b8b9a;
  --accent:#e50914; --accent2:#ff3b30; --border:#232334; --radius:14px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- Bar atas ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.92);
  backdrop-filter:blur(20px);border-bottom:1px solid var(--border);
  padding:calc(var(--safe-t) + 10px) 16px 10px}
.bar{display:flex;align-items:center;gap:12px;max-width:1600px;margin:0 auto}
.logo{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--accent);cursor:pointer;
  flex-shrink:0}
.logo span{color:var(--text)}
.cari{flex:1;display:flex;gap:8px;max-width:560px;margin-left:auto}
.cari input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 14px;font-size:15px;outline:none;min-height:44px}
.cari input:focus{border-color:var(--accent)}
.cari button{background:var(--accent);color:#fff;border:0;border-radius:10px;
  padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.tab{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0;max-width:1600px;margin:0 auto;
  scrollbar-width:none}
.tab::-webkit-scrollbar{display:none}
.tab button{background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:999px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;
  white-space:nowrap;min-height:40px;transition:all .18s}
.tab button.aktif,.tab button:focus-visible{background:var(--accent);border-color:var(--accent);color:#fff}

main{max-width:1600px;margin:0 auto;padding:20px 16px calc(var(--safe-b) + 90px);min-height:60vh}

/* ---------- Baris kandungan ---------- */
.baris{margin-bottom:34px}
.baris h2{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;
  align-items:center;gap:10px}
.baris h2::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px}
.skrol{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;
  scroll-snap-type:x mandatory;scrollbar-width:none}
.skrol::-webkit-scrollbar{display:none}

/* ---------- Kad ---------- */
.kad{flex:0 0 auto;width:158px;scroll-snap-align:start;cursor:pointer;
  transition:transform .2s;border-radius:var(--radius);outline:none}
.kad:hover,.kad:focus-visible{transform:translateY(-4px)}
.kad:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.poster{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);
  overflow:hidden;background:var(--card);border:1px solid var(--border)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .lencana{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);
  color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px}
.poster .main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.kad:hover .poster .main,.kad:focus-visible .poster .main{opacity:1}
.main-ikon{width:52px;height:52px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:22px}
.kad .nama{font-size:13px;font-weight:600;margin-top:8px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kad .meta{font-size:11px;color:var(--muted);margin-top:3px}

/* ---------- Butiran ---------- */
.butiran{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:30px}
.butiran .poster-besar{width:230px;flex-shrink:0}
.butiran .info{flex:1;min-width:280px}
.butiran h1{font-size:30px;font-weight:900;line-height:1.15;margin-bottom:12px}
.tanda{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tanda span{background:var(--card);border:1px solid var(--border);padding:5px 12px;
  border-radius:999px;font-size:13px;color:var(--muted)}
.tanda span.skor{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.butiran p.ringkas{color:var(--muted);line-height:1.7;margin-bottom:20px;font-size:15px}
.aksi{display:flex;gap:12px;flex-wrap:wrap}
.aksi button{border:0;border-radius:10px;padding:13px 26px;font-weight:700;font-size:15px;
  cursor:pointer;min-height:48px;transition:opacity .2s}
.aksi button:active{opacity:.8}
.btn-utama{background:var(--accent);color:#fff}
.btn-kedua{background:var(--card);color:var(--text);border:1px solid var(--border)!important}

/* ---------- Episod ---------- */
.senarai-ep{margin-top:26px}
.senarai-ep h3{font-size:17px;font-weight:800;margin-bottom:14px}
.grid-ep{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ep{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:13px 15px;cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:all .18s;min-height:56px;text-align:left;color:var(--text);font-size:14px}
.ep:hover,.ep:focus-visible{border-color:var(--accent);background:var(--bg2);
  transform:translateX(3px);outline:none}
.ep .n{background:var(--bg);border-radius:7px;min-width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:13px;flex-shrink:0}
.ep .t{flex:1;min-width:0}
.ep .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ep .t small{color:var(--muted);font-size:11px}

/* ---------- Pemain ---------- */
#pemain{position:fixed;inset:0;z-index:999;background:#000;display:none;
  flex-direction:column}
#pemain.sedia{display:flex}
#pemain video{width:100%;height:100%;object-fit:contain;background:#000}
.plapisan{position:absolute;inset:0;opacity:1;transition:opacity .25s;
  display:flex;flex-direction:column;justify-content:space-between}
.plapisan.sorok{opacity:0;pointer-events:none}
.patas{display:flex;align-items:center;gap:14px;padding:calc(var(--safe-t) + 14px) 20px 20px;
  background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
.patas button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;
  min-width:44px;min-height:44px;font-size:18px;cursor:pointer}
.patas .tajuk-p{font-weight:700;font-size:16px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbawah{padding:20px 20px calc(var(--safe-b) + 20px);
  background:linear-gradient(0deg,rgba(0,0,0,.9),transparent)}
.bar{height:5px;background:rgba(255,255,255,.22);border-radius:3px;cursor:pointer;
  margin-bottom:16px;position:relative}
.bar:hover{height:8px}
.kemajuan{height:100%;background:var(--accent);border-radius:3px;width:0;position:relative}
.kemajuan::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;background:var(--accent);border-radius:50%;opacity:0;transition:opacity .2s}
.bar:hover .kemajuan::after{opacity:1}
.pkawalan{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pkawalan button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;
  min-width:46px;min-height:46px;font-size:17px;cursor:pointer;transition:background .18s}
.pkawalan button:hover{background:rgba(255,255,255,.26)}
.pkawalan .utama{background:var(--accent);min-width:58px;min-height:58px;font-size:22px;
  border-radius:50%}
.masa{color:#fff;font-size:14px;font-variant-numeric:tabular-nums;margin-left:auto}
.kkualiti{display:flex;gap:8px;margin-left:auto}
.kkualiti button{font-size:12px;padding:7px 12px;min-width:auto;min-height:36px}
.kkualiti button.aktif{background:var(--accent)}

/* ---------- Nota ---------- */
.nota{background:rgba(229,9,20,.1);border:1px solid rgba(229,9,20,.3);
  border-radius:10px;padding:12px 16px;color:#ffb3b8;font-size:13.5px;margin-bottom:20px}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--card) 25%,#1e1e2a 50%,var(--card) 75%);
  background-size:200% 100%;animation:kilau 1.5s infinite;border-radius:var(--radius)}
@keyframes kilau{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-kad{flex:0 0 auto;width:158px}
.sk-poster{width:100%;aspect-ratio:2/3;margin-bottom:8px}
.sk-baris{height:13px;margin-bottom:6px;border-radius:5px}

/* ---------- TV ---------- */
@media (min-width:1200px){
  .kad{width:186px}
  .sk-kad{width:186px}
  .butiran h1{font-size:38px}
}
@media (min-width:1200px) and (hover:none){
  /* Android TV: grid bukan skrol mendatar (D-pad lebih mudah) */
  .skrol{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;overflow:visible}
  .kad{width:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" onclick="NEXPLAY.rumah()">NEX<span>PLAY</span></div>
    <div class="cari">
      <input id="kotak-cari" type="search" placeholder="Cari drama, movie, anime, donghua…"
             autocomplete="off" aria-label="Cari">
      <button onclick="NEXPLAY.cariDariKotak()" aria-label="Cari">🔍</button>
    </div>
  </div>
  <div class="tab" id="tab"></div>
</header>

<main id="utama"></main>

<div id="pemain" role="dialog" aria-label="Pemain video">
  <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
  <div class="plapisan" id="plapisan">
    <div class="patas">
      <button onclick="NEXPLAY.tutupPemain()" aria-label="Tutup">←</button>
      <div class="tajuk-p" id="tajuk-p">—</div>
    </div>
    <div class="pbawah">
      <div class="bar" id="bar" role="slider" aria-label="Kedudukan">
        <div class="kemajuan" id="kemajuan"></div>
      </div>
      <div class="pkawalan">
        <button onclick="NEXPLAY.lompat(-10)" aria-label="Undur 10 saat">⏪</button>
        <button class="utama" id="btn-main" onclick="NEXPLAY.togolMain()" aria-label="Main">▶</button>
        <button onclick="NEXPLAY.lompat(10)" aria-label="Maju 10 saat">⏩</button>
        <span class="masa" id="masa">0:00 / 0:00</span>
        <button onclick="NEXPLAY.laju()" id="btn-laju" aria-label="Kelajuan">1x</button>
        <button onclick="NEXPLAY.pip()" aria-label="Gambar dalam gambar">⧉</button>
        <button onclick="NEXPLAY.skrinPenuh()" aria-label="Skrin penuh">⛶</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
